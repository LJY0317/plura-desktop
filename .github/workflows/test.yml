name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run safety tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: for script in scripts/*.sh; do sh -n "$script"; done
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content -Raw scripts/plura-desktop.ps1))'
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Install packaged CLI
        run: python -m pip install --no-deps .
      - name: Smoke packaged CLI
        run: |
          plura-desktop --version
          plura-desktop-diagnose --help
      - name: Smoke standalone macOS runtime
        if: runner.os == 'macOS' && matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m pip install "pyinstaller==6.22.3"
          scripts/build-macos-standalone.sh "$RUNNER_TEMP/plura-standalone" "$(uname -m)"
      - name: Check repository invariants
        run: python scripts/check_repository_invariants.py

  python-compat:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run safety tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Install packaged CLI
        run: python -m pip install --no-deps .
      - name: Smoke packaged CLI
        run: |
          plura-desktop --version
          plura-desktop-diagnose --help
